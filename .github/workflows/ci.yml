name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check .
      - run: python -m black --check .
      - run: python -m isort --check-only .
      - run: python -m mypy resumes
      - run: python manage.py check
      - run: python manage.py check_production_runtime
      - run: python -m pytest -q -m "not e2e and not weasyprint"

  linux-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install WeasyPrint system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcairo2 \
            libpango-1.0-0 \
            libpangocairo-1.0-0 \
            libgdk-pixbuf-2.0-0 \
            libffi-dev \
            shared-mime-info
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m playwright install chromium
      - run: python manage.py migrate --noinput
      - run: python -m pytest -q -m "weasyprint or e2e"
      - name: Regenerate README screenshots
        run: python scripts/generate_readme_screenshots.py
      - name: Verify README screenshot assets
        run: python -m pytest -q tests/test_screenshots.py::test_readme_screenshot_assets_exist_and_are_non_trivial
